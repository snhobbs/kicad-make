# Thicknesses in mm. Dielectric colours (the board body in 3D) are KiCad names
# or "#RRGGBBAA" (AA = opacity); mask and silkscreen colours are in colors/.
name: JLCPCB 6-layer HDI 1+4+1 FR4 1.6 mm (JLC06161H-1080)
description: JLCPCB 6-layer, 1.6 mm, 1+4+1 build (laser microvias L1-L2 and L5-L6), 1 oz outer / 0.5 oz inner
source: https://jlcpcb.com/impedance
# JLCPCB's impedance page lists JLC06161H-1080 as a standard 6-layer, not as an
# HDI build. It is used here because its thin 1080 outer prepreg suits laser
# microvias (0.0764 mm, aspect ratio under 1:1 for 0.1 mm drills). Confirm the
# build with JLCPCB when quoting the HDI order.
solder_mask:
  thickness: 0.01
  material: Liquid Ink
  epsilon_r: 3.8
  loss_tangent: 0
layers:
  - copper: 0.035
  - prepreg:
      thickness: 0.0764
      material: Prepreg 1080
      epsilon_r: 3.91
      loss_tangent: 0.02
      color: FR4 natural
  - copper: 0.0152
  - core:
      thickness: 0.55
      material: FR4
      epsilon_r: 4.6
      loss_tangent: 0.02
      color: FR4 natural
  - copper: 0.0152
  - prepreg:
      thickness: 0.2104
      material: Prepreg 7628
      epsilon_r: 4.4
      loss_tangent: 0.02
      color: FR4 natural
  - copper: 0.0152
  - core:
      thickness: 0.55
      material: FR4
      epsilon_r: 4.6
      loss_tangent: 0.02
      color: FR4 natural
  - copper: 0.0152
  - prepreg:
      thickness: 0.0764
      material: Prepreg 1080
      epsilon_r: 3.91
      loss_tangent: 0.02
      color: FR4 natural
  - copper: 0.035
