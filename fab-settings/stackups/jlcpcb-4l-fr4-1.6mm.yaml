# Thicknesses in mm. Dielectric colours (the board body in 3D) are KiCad names
# or "#RRGGBBAA" (AA = opacity); mask and silkscreen colours are in colors/.
name: JLCPCB 4-layer FR4 (JLC04161H-7628)
description: JLCPCB default 4-layer, 1.6 mm, 1 oz outer / 0.5 oz inner
source: https://jlcpcb.com/impedance
solder_mask:
  thickness: 0.01
  material: Liquid Ink
  epsilon_r: 3.8
  loss_tangent: 0
# From the 50R net class on the old JLC04161H-7628 settings board; 100 ohm is computed
impedance_widths:
  50: 0.34925
layers:
  - copper: 0.035
  - prepreg:
      thickness: 0.2104
      material: Prepreg 7628
      epsilon_r: 4.4
      loss_tangent: 0.02
      color: FR4 natural
  - copper: 0.0152
  - core:
      thickness: 1.065
      material: FR4
      epsilon_r: 4.6
      loss_tangent: 0.02
      color: FR4 natural
  - copper: 0.0152
  - prepreg:
      thickness: 0.2104
      material: Prepreg 7628
      epsilon_r: 4.4
      loss_tangent: 0.02
      color: FR4 natural
  - copper: 0.035
