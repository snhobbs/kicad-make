# Thicknesses in mm. Dielectric colours (the board body in 3D) are KiCad names
# or "#RRGGBBAA" (AA = opacity); mask and silkscreen colours are in colors/.
# The coverlay is modelled as the solder mask, which is where KiCad renders it.
name: JLCPCB 2-layer flex
description: JLCPCB 2-layer FPC, 0.11 mm, 25 um adhesiveless PI, 1/3 oz copper
source: https://jlcpcb.com/capabilities/flex-pcb-capabilities
solder_mask:
  thickness: 0.0275  # PI 12.5 um + adhesive 15 um
  material: Coverlay
  epsilon_r: 3.3
  loss_tangent: 0.002
layers:
  - copper: 0.015  # 12 um foil + plating
  - core:
      thickness: 0.025
      material: Polyimide
      epsilon_r: 3.3
      loss_tangent: 0.002
      color: "#C29600D4"
  - copper: 0.015
